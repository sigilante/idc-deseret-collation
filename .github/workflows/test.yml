name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ICU and PyICU
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev pkg-config
          python -m pip install --upgrade pip
          python -m pip install PyICU
      - name: Python tests (reference implementation + ICU rules)
        run: python tests/run_tests.py
      - name: JavaScript tests
        run: node examples/javascript/test.mjs
      - name: ICU4C example
        run: |
          c++ -std=c++17 examples/icu4c/example.cpp $(pkg-config --cflags --libs icu-i18n icu-uc icu-io) -o /tmp/icu4c-example
          /tmp/icu4c-example collation/deseret-speller.rules < tests/words.txt > /tmp/out.txt
          diff <(grep -v '^#' tests/words.txt) /tmp/out.txt
